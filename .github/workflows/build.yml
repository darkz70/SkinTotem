name: Build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        platform: [fabric, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: Build ${{ matrix.platform }}
        run: ./gradlew buildAndCollect+${{ matrix.platform }}+All -Pci_loader=${{ matrix.platform }}
      - name: Find built jars
        run: find . -path "*/build/libs/*.jar" -o -path "*/build/*/collected/*.jar" | tee found_jars.txt
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkinTotem-${{ matrix.platform }}-jars
          path: |
            **/build/libs/*.jar
            **/build/**/collected/*.jar
          if-no-files-found: warn
