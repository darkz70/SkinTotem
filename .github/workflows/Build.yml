name: Build Skin Totem (All Versions)

on:
  push:
    branches:
      - main
      - "1.20.1"
      - "1.21.1"
      - "1.21.4"
      - "1.21.5"
      - "26.1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MC ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.ref_name }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ github.ref_name }}-
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      # Upload .jar as artifact (available for 90 days)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skin-totem-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*-*.jar
          if-no-files-found: error

  # Auto-release when you push a tag like v1.0.0-1.21.5
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for release
        run: ./gradlew build --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*-*.jar
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
