name: Fix version subprojects
on: workflow_dispatch

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Neoforge
      - name: Create build.gradle in each version
        run: |
          for v in 1.20.1 1.21 1.21.1 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11; do
            cat > versions/$v/build.gradle << 'EOF'
          plugins {
              id "java"
              id "net.neoforged.moddev"
              id "dev.kikugie.stonecutter"
              id "io.freefair.lombok"
          }
          EOF
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add versions/
          git commit -m "fix: add build.gradle to version subprojects"
          git push
