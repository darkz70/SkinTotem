plugins {
    id "net.lopymine.mossy-plugin-core" version "$mossy_plugin_version"
}

mossyDependencies {
    minecraft = stonecutter.current.version.toString()
    lombok = prop("base.lombok_version")

    // NeoForge вместо Fabric
    neoforge = prop("build.neoforge")
    neoforgeArtifact = prop("build.neoforge_artifact")

    additional {
        disable("embeddium")
    }
}

mossyResources {
    // expandFiles = [...]
}

repositories {
    mavenCentral()
    maven { name = "NeoForge"; url = "https://maven.neoforged.net/releases" }
    maven { name = "Mixin Squared"; url = "https://maven.bawnorton.com/releases" }
    maven { name = "YACL"; url = "https://maven.isxander.dev/releases" }
    maven { name = "Modrinth Maven"; url = "https://api.modrinth.com/maven" }
}

dependencies {
    // Lombok
    compileOnly "org.projectlombok:lombok:${prop("base.lombok_version")}"
    annotationProcessor "org.projectlombok:lombok:${prop("base.lombok_version")}"

    // MixinSquared (NeoForge build)
    jarJar(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-forge:${prop("build.mixin_squared")}")))

    // Embeddium (опциональный compat)
    def emb = prop("dep.embeddium")
    if (emb != "unknown") {
        modCompileOnly "maven.modrinth:embeddium:${emb}"
    }
}

String prop(String key) {
    return findProperty(key).toString()
}
