# # # # # # # # # # # # # #
#    Project Properties   #
# # # # # # # # # # # # # #

# Gradle Settings
org.gradle.jvmargs=-Xmx24G
org.gradle.parallel=true

# FigureStone Plugin
figurestone_plugin_version = 1.3.4

# Data Properties
data.mod_id = skin-totem
data.mod_name = Skin Totem
data.mod_version = 2.0.1
data.mod_group = com.darkz.skintotem
data.mod_maven_group = net.darkz70
data.mixin_configs = modmenu sodium yacl cit-resewn
data.sides = client

data.mod_description = Replaces regular totems with autogenerated 2D or 3D totems for EVERY player in Minecraft! Rename your totem to player's nickname to use its skin.
data.mod_authors = darkz70
data.github_mod_author = darkz70
data.mod_license = CC-BY-ND 4.0

# Base Properties
base.lombok_version = 1.18.44
base.mixinextras_version = 0.4.1
base.mixin_version = 0.8.5

# Per-Loader Versions
fabric.multi_versions = 1.20.1
forge.multi_versions = 1.20.1

# Mod Loaders
mod_loaders = fabric forge

# Build Properties
build.fabric_loader = 0.19.2
build.fabric_api = [VERSIONED]
build.neoforge = [VERSIONED]
build.parchment = [VERSIONED]
build.forge = [VERSIONED]
build.mixin_squared = 0.3.3

# Additional Dependencies, "dep." is important
dep.yacl = [VERSIONED]
dep.modmenu = [VERSIONED]
dep.sodium = [VERSIONED]
dep.iris = [VERSIONED]
dep.embeddium = [VERSIONED]
dep.oculus = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

# Supported Versions, 1.21[1] -> 1.21-1.21.1
fabric.versions_specifications = 26.2
forge.versions_specifications = 26.2

# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs
modrinth_id = sDrUdjIJ
curseforge_id = 1643395

# CurseForge Settings
is_for_client = true
is_for_server = false
max_java_version = 21

# Fabric Dependencies
fabric.depends_requires = fabric-api
fabric.depends_optional = modmenu yacl
fabric.depends_incompatible = none
fabric.depends_embeds  = none

## Forge Dependencies
forge.depends_requires = none
forge.depends_optional = yacl
forge.depends_incompatible = none
forge.depends_embeds  = none

# Stonecutter Stuff
dev.kikugie.stonecutter.hard_mode=true
