# # # # # # # # # # # # # #
#    Gradle Properties    #
# # # # # # # # # # # # # #

org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true

# Mossy Plugin
mossy_plugin_version = 1.1.0.0

# Stonecutter
dev.kikugie.stonecutter.hard_mode=true

# Mod Properties
data.mod_id = skintotem
data.mod_name = Skin-Totem
data.mod_version = 1.1.0
data.mod_group = net.lopymine.mtd
data.mod_maven_group = net.lopymine

data.mod_description = Replaces regular totems with autogenerated 2D or 3D totems for EVERY player in Minecraft!
data.mod_authors = Darkz, LopyMine, KlashRaick
data.mod_license = CC-BY-ND 4.0

# Main Dependencies
base.lombok_version = 1.18.42

# Multi-Versions Properties
multi_versions = 1.20.1 1.21 1.21.1 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11

# Build Dependencies (versioned overrides in versions/X.Y.Z/gradle.properties)
build.neoforge = [VERSIONED]
build.neoforge_artifact = [VERSIONED]
build.mixin_squared = 0.2.0+build.2

# Additional Dependencies
dep.yacl = [VERSIONED]
dep.embeddium = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

loaders = neoforge
versions_specifications = 1.20.1 1.21 1.21.1 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11
version_type = RELEASE
test_publish = false

modrinth_id = ygYU16dG
curseforge_id = 1065783

curseforge_token = ${System.getenv("CURSEFORGE_API_KEY")}
modrinth_token = ${System.getenv("MODRINTH_API_KEY")}

is_for_client = true
is_for_server = false
max_java_version = 21

depends_requires = neoforge
depends_optional = yacl
depends_incompatible = none
depends_embeds = none
