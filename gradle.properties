# # # # # # # # # # # # # #
#    Gradle Properties    #
# # # # # # # # # # # # # #

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx24G
org.gradle.parallel=false

# FigureStone Plugin
figurestone_plugin_version = 1.1.0

# Stonecutter
dev.kikugie.stonecutter.hard_mode=true

#  Properties
data.mod_id = skintotem
data.mod_name = Skin-Totem
data.mod_version = 2.0.0
data.mod_group = net.darkz70.skintotem
data.mod_maven_group = net.darkz70

data.mod_description = Replaces regular totems with autogenerated 2D or 3D totems for EVERY player in Minecraft! Rename your totem to player's nickname to use its skin.
data.mod_authors = Darkz
data.mod_license = CC-BY-ND 4.0
data.sides = both
data.mixin_configs = yacl modmenu sodium cit-resewn

# Main Dependencies
base.lombok_version = 1.18.42

# Multi-Versions Properties
# Verified version: 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8
fabric.multi_versions = 1.21 1.21.1 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11

# Build Dependencies
build.yarn = [VERSIONED]
build.fabric_loader = 0.17.2
build.fabric_api = [VERSIONED]
build.mixin_squared = 0.2.0

# Additional Dependencies, "dep." is important
dep.yacl = [VERSIONED]
dep.modmenu = [VERSIONED]
dep.cit-resewn = [VERSIONED]
dep.ears = [VERSIONED]
dep.sodium = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

#  Loaders
mod_loaders = fabric
# Publication Versions from `ROOT/libs/mod-version-here.jar` or from `ROOT/versions/MC_VERSION/build/libs/...` if not present in root
fabric.versions_specifications = 1.21 1.21.1 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10
# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs
modrinth_id = sDrUdjIJ
curseforge_id = 1567155

# API Tokens
# Do not put tokens here! Use GitHub Secrets instead.
curseforge_token = ${System.getenv("CURSEFORGE_API_KEY")}
modrinth_token = ${System.getenv("MODRINTH_API_KEY")}

# CurseForge Settings
is_for_client = true
is_for_server = false
max_java_version = 21

#  Depends
fabric.depends_requires = fabric-api
fabric.depends_optional = modmenu yacl
fabric.depends_incompatible = none
fabric.depends_embeds  = none
