# # # # # # # # # # # # # #
#    Gradle Properties    #
# # # # # # # # # # # # # #

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx24G
org.gradle.parallel=true

# Mossy Plugin
mossy_plugin_version = 1.1.0.0

# Stonecutter
dev.kikugie.stonecutter.hard_mode=true

# Mod Properties
data.mod_id = skintotem
data.mod_name = Skin-Totem
data.mod_version = 1.0.0
data.mod_group = net.lopymine.mtd
data.mod_maven_group = net.lopymine

data.mod_description = Replaces regular totems with autogenerated 2D or 3D totems for EVERY player in Minecraft! Rename your totem to player's nickname to use its skin.
data.mod_authors = Darkz, LopyMine, KlashRaick
data.mod_license = CC-BY-ND 4.0

# Main Dependencies
base.lombok_version = 1.18.42

# Multi-Versions Properties
# Verified version: 26.1 26.1.1 26.1.2
multi_versions = 26.1 26.1.1 26.1.2

# Build Dependencies
build.yarn = [VERSIONED]
build.fabric_loader = 0.18.4
build.fabric_api = [VERSIONED]
build.mixin_squared = 0.2.0

# Additional Dependencies, "dep." is important
dep.yacl = [VERSIONED]
dep.modmenu = [VERSIONED]
dep.cit-resewn = [VERSIONED]
dep.ears = [VERSIONED]
dep.sodium = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

# Mod Loaders
loaders = fabric
# Publication Versions from `ROOT/libs/mod-version-here.jar` or from `ROOT/versions/MC_VERSION/build/libs/...` if not present in root
versions_specifications = 26.1 26.1.1 26.1.2
# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs
modrinth_id = ygYU16dG
curseforge_id = 1065783

# API Tokens
# Do not put tokens here! Use GitHub Secrets instead.
curseforge_token = ${System.getenv("CURSEFORGE_API_KEY")}
modrinth_token = ${System.getenv("MODRINTH_API_KEY")}

# CurseForge Settings
is_for_client = true
is_for_server = false
max_java_version = 21

# Mod Depends
depends_requires = fabric-api
depends_optional = modmenu yacl
depends_incompatible = none
depends_embeds  = none
